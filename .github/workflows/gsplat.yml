name: gsplat

on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/gsplat.yml

  workflow_dispatch:  # Web UI trigger

permissions:
  contents: write  # needed to update the 'gsplat' tag and release

jobs:
  build:
    name: 'gsplat wheels (python ${{ matrix.python_version }}, torch ${{ matrix.torch_version }}+${{ matrix.torch_cuda }})'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Keep in sync with the Google Colab GPU runtime (and with ci.yml):
          # https://github.com/googlecolab/backend-info
          - os: 'ubuntu-24.04'
            python_version: '3.12'
            cuda_version: '13.0'
            # T4 (7.5), A100 (8.0), L4 (8.9), H100 (9.0), RTX PRO 6000 / G4 (12.0)
            torch_cuda_arch_list: '7.5;8.0;8.9;9.0;12.0'
            torch_version: '2.11.0'
            torch_cuda: 'cu130'
            # gsplat has no release that supports CUDA 13 yet, so a commit of
            # its main branch is pinned here. Update it to pick up new changes.
            gsplat_ref: '512d366b67073d77ca099ede742683c165dfc23b'

    env:
      CUDA_HOME: '/usr/local/cuda'
      TORCH_CUDA_ARCH_LIST: '${{ matrix.torch_cuda_arch_list }}'
      MAX_JOBS: '2'
      # Applied to every pip call (isolated build environments included), so
      # nothing can be compiled against a different PyTorch build
      PIP_CONSTRAINT: '${{ github.workspace }}/constraints.txt'
      PIP_EXTRA_INDEX_URL: 'https://download.pytorch.org/whl/${{ matrix.torch_cuda }}'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install CUDA Toolkit
        run: |
          CUDA_VERSION_DASH=$(echo "${{ matrix.cuda_version }}" | sed 's/\./-/')
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get -y install cuda-toolkit-${CUDA_VERSION_DASH}
          echo "${CUDA_HOME}/bin" >> $GITHUB_PATH
          ${CUDA_HOME}/bin/nvcc --version

      - name: Install PyTorch ${{ matrix.torch_version }}+${{ matrix.torch_cuda }}
        run: |
          echo "torch==${{ matrix.torch_version }}" > constraints.txt
          pip install --upgrade pip "setuptools<82" wheel ninja numpy rich
          pip install torch==${{ matrix.torch_version }}
          python -c "import torch; print('PyTorch:', torch.__version__, '| CUDA:', torch.version.cuda)"
          python -c "import torch; assert torch.__version__ == '${{ matrix.torch_version }}+${{ matrix.torch_cuda }}', torch.__version__"

      - name: Clone gsplat repository
        run: |
          git clone --recursive https://github.com/nerfstudio-project/gsplat
          git -C gsplat checkout ${{ matrix.gsplat_ref }}
          git -C gsplat submodule update --init --recursive

      - name: Build gsplat wheel
        run: |
          cd gsplat
          python setup.py bdist_wheel --dist-dir=${{ github.workspace }}/dist

      - name: Build wheels of the trainer's git dependencies
        run: |
          # examples/requirements.txt installs a few packages straight from git.
          # Some of them compile CUDA code, so they are prebuilt here as well.
          grep -E '(^| )git\+https://' gsplat/examples/requirements.txt | grep -v '^ *#' > git-requirements.txt
          cat git-requirements.txt
          while read -r req; do
              echo "::group::${req}"
              # Prefer the PyTorch already installed; fall back to an isolated
              # build (pinned by PIP_CONSTRAINT) for projects that need it
              pip wheel --no-deps --no-build-isolation -w dist "$req" \
                || pip wheel --no-deps -w dist "$req"
              echo "::endgroup::"
          done < git-requirements.txt

      - name: Collect the trainer's remaining requirements
        run: |
          # Everything that install-gsplat.sh installs from PyPI: the example
          # trainer's requirements without the PyTorch pins (the runtime's own
          # PyTorch is used) and without the git packages (prebuilt above),
          # plus gsplat's own runtime dependencies
          grep -vE '^ *(#|$)' gsplat/examples/requirements.txt \
            | grep -vE '^(torch|torchvision)([=<>! ]|$)' \
            | grep -vE '(^| )git\+https://' > requirements.txt
          printf '%s\n' ninja jaxtyping nvtx 'rich>=12' >> requirements.txt
          cat requirements.txt

      - name: Test wheels
        run: |
          ls -lah dist
          # The compiled extension must be inside the wheel, otherwise gsplat
          # would compile it on first use
          unzip -l dist/gsplat-*.whl | grep -E 'gsplat/csrc.*\.so'
          pip install --no-deps dist/*.whl
          pip install jaxtyping nvtx
          cd dist
          python -c "import gsplat; print('gsplat:', gsplat.__version__)"
          # Runners have no GPU, so loading the CUDA extension is informative only
          python -c "from gsplat import csrc; print('gsplat.csrc loaded')" || echo "::warning::gsplat.csrc could not be loaded on the runner"

      - name: Package release files
        run: |
          (cd dist && ls *.whl) > wheels.txt
          tar czf gsplat-examples.tar.gz -C gsplat examples
          cat > gsplat-versions.txt << EOF
          ubuntu=24.04
          python=${{ matrix.python_version }}
          cuda=${{ matrix.cuda_version }}
          cuda_arch=${{ matrix.torch_cuda_arch_list }}
          torch=${{ matrix.torch_version }}+${{ matrix.torch_cuda }}
          gsplat=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' gsplat/gsplat/version.py) ($(git -C gsplat rev-parse --short HEAD))
          EOF
          cat wheels.txt gsplat-versions.txt

      - name: Update tag
        uses: richardsimko/update-tag@v1
        with:
          tag_name: 'gsplat'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ncipollo/release-action@v1
        with:
          name: 'gsplat wheels'
          tag: 'gsplat'
          commit: 'main'
          # install.sh downloads from the latest release, which must stay the
          # 'continuous' one
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: 'dist/*.whl,wheels.txt,requirements.txt,gsplat-examples.tar.gz,gsplat-versions.txt'
          body: 'Wheels are compatible with the current Google Colab GPU runtime (Ubuntu 24.04, Python ${{ matrix.python_version }}, CUDA ${{ matrix.cuda_version }}, PyTorch ${{ matrix.torch_version }}+${{ matrix.torch_cuda }}).'
